<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#143522">
<meta name="description" content="Roots & Remedy Agri Guide — free crop pest, disease and fertiliser guide for farmers in Lesotho.">
<title>Roots & Remedy Agri Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0f2a1b; --forest:#143522; --forest2:#1f4d31; --leaf:#4f9a5b; --leaf2:#7fb069; --sand:#efe7d2; --cream:#f8f5ec;
  --clay:#c4683b; --clay2:#e08a5a; --sun:#e9b949; --ink:#17251c; --muted:#66756b; --line:#e4dcc6; --card:#fff;
  --high:#c4412e; --high-bg:#fbe5e0; --watch:#b97c0c; --watch-bg:#fbf0d4; --low:#2f8a46; --low-bg:#e2f2e5;
  --r:22px; --spring:cubic-bezier(.2,.9,.25,1.15); --ease:cubic-bezier(.22,.8,.24,1);
  --head:"Fraunces",Georgia,serif; --body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--cream)}
body{font-family:var(--body);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
img{display:block;max-width:100%}
.screen{min-height:100vh;animation:enter .55s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
::view-transition-old(root),::view-transition-new(root){animation-duration:.42s;animation-timing-function:var(--ease)}
.wrap{max-width:620px;margin:0 auto;padding:0 18px 48px}
.press{transition:transform .25s var(--spring),box-shadow .25s var(--ease)}
.press:active{transform:scale(.965)}

/* top bar */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 18px;background:rgba(248,245,236,.82);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid rgba(0,0,0,.05)}
.bar.dark{background:rgba(15,42,27,.55);border-color:rgba(255,255,255,.08);color:#fff}
.back{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.06)}
.bar.dark .back{background:rgba(255,255,255,.14)}
.brand{flex:1;display:flex;align-items:center;gap:9px;font-family:var(--head);font-weight:800;font-size:18px;letter-spacing:.2px}
.lang{display:flex;background:rgba(0,0,0,.07);border-radius:999px;padding:3px;position:relative}
.bar.dark .lang{background:rgba(255,255,255,.14)}
.lang button{position:relative;z-index:1;padding:6px 11px;border-radius:999px;font-size:12.5px;font-weight:700;opacity:.7;transition:opacity .2s,color .2s}
.lang button.on{opacity:1;background:#fff;color:var(--forest);box-shadow:0 1px 4px rgba(0,0,0,.12)}

/* hero */
.hero{position:relative;min-height:100vh;color:#fff;display:flex;flex-direction:column;overflow:hidden;background:var(--night)}
.hero .bg{position:absolute;inset:0;background:
   linear-gradient(180deg,rgba(10,30,19,.25) 0%,rgba(10,30,19,.15) 35%,rgba(10,30,19,.85) 78%,var(--night) 100%),
   url(images/landscape.webp) center/cover no-repeat,
   radial-gradient(120% 70% at 70% 10%,#e9b949 0%,#c4683b 22%,#3d5f3a 55%,#143522 100%);
   transform:scale(1.06);animation:slowzoom 18s ease-out both}
@keyframes slowzoom{from{transform:scale(1.14)}to{transform:scale(1.04)}}
.hero .ridge{position:absolute;left:0;right:0;bottom:0;height:46%;pointer-events:none;opacity:.9}
.hero .content{position:relative;z-index:2;margin-top:auto;padding:0 22px 40px;max-width:620px;width:100%;align-self:center}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);padding:7px 12px;border-radius:999px;animation:rise .7s .1s var(--ease) both}
.hero h1{font-family:var(--head);font-weight:800;font-size:clamp(40px,11vw,64px);line-height:.98;margin:16px 0 12px;letter-spacing:-.5px;animation:rise .8s .2s var(--ease) both}
.hero h1 em{font-style:normal;color:var(--sun)}
.hero p.lead{font-size:17px;opacity:.88;max-width:440px;animation:rise .8s .3s var(--ease) both}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#fff;color:var(--forest);font-weight:800;font-size:17px;padding:17px 22px;border-radius:18px;margin-top:26px;box-shadow:0 14px 34px rgba(0,0,0,.28);animation:rise .8s .42s var(--ease) both}
.cta.clay{background:var(--clay);color:#fff}
.trust{display:flex;gap:16px;margin-top:18px;font-size:12.5px;opacity:.8;flex-wrap:wrap;animation:rise .8s .5s var(--ease) both}

/* my farm */
.farm{margin-top:18px;display:grid;gap:12px}
.fcard{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:12px 14px;text-align:left;width:100%;animation:rise .7s var(--ease) both}
.fcard .ph{width:56px;height:56px;flex:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.fcard b{display:block;font-size:16px}
.fcard small{opacity:.8;font-size:12.5px}
.fcard .rk{margin-left:auto;font-size:11px;font-weight:800;text-transform:uppercase;padding:5px 9px;border-radius:999px}

/* headings */
.step{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--clay);margin-top:24px}
h1.t{font-family:var(--head);font-weight:800;font-size:34px;line-height:1.05;margin:8px 0 6px;letter-spacing:-.3px}
.sub{color:var(--muted);font-size:15px}

/* map */
.mapbox{position:relative;margin-top:14px;border-radius:28px;padding:10px 6px 4px;background:
  radial-gradient(90% 70% at 50% 35%,#fffdf6 0%,#efe7d2 70%,#e5dbc0 100%);box-shadow:inset 0 1px 0 #fff,0 18px 40px rgba(20,53,34,.12);overflow:hidden}
.mapbox svg{width:100%;height:auto;display:block;overflow:visible}
.side{fill:#2b4d33}
.dg{cursor:pointer;transition:transform .45s var(--spring),filter .45s var(--ease);transform-box:fill-box;transform-origin:50% 60%}
.dg .top{stroke:#fbf7ea;stroke-width:1.6;stroke-linejoin:round;transition:fill .35s var(--ease)}
.dg .lift{fill:#22412b;opacity:0;transition:opacity .3s}
.dg.hv,.dg.on{transform:translateY(-12px) scale(1.07);filter:drop-shadow(0 16px 14px rgba(15,42,27,.35))}
.dg.hv .lift,.dg.on .lift{opacity:1}
.dg.on .top{fill:url(#gClay)!important}
.lbl{font:700 11px var(--body);fill:#fff;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:rgba(15,42,27,.55);stroke-width:3px;transition:opacity .3s}
.legend2{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--muted);padding:8px 0 6px}
.legend2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.credit{font-size:10.5px;color:var(--muted);text-align:right;padding:0 10px 6px}

/* bottom sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;transform:translateY(110%);transition:transform .5s var(--spring)}
.sheet.show{transform:none}
.sheet .in{max-width:620px;margin:0 auto;background:#fff;border-radius:28px 28px 0 0;padding:10px 20px 26px;box-shadow:0 -20px 50px rgba(15,42,27,.25)}
.grab{width:42px;height:5px;border-radius:9px;background:#ddd;margin:0 auto 14px}
.sheet h3{font-family:var(--head);font-size:28px;font-weight:800}
.sheet .meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.tag{font-size:12.5px;font-weight:600;background:var(--sand);border-radius:999px;padding:6px 11px}
.sheet .ph{width:64px;height:64px;flex:none;filter:drop-shadow(0 8px 10px rgba(0,0,0,.2))}
.sheet .ph.emoji{font-size:48px}
.fcard .ph.emoji{font-size:40px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--forest);color:#fff;border-radius:16px;padding:16px;font-weight:800;font-size:16px;margin-top:16px}

/* crops */
.crops{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}
.crop{position:relative;background:linear-gradient(180deg,#fff 0%,#f6f1e4 100%);border-radius:var(--r);padding:16px 12px 14px;text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.02),0 10px 24px rgba(20,53,34,.08);border:2px solid transparent;animation:rise .6s var(--ease) both}
.crop .ph{width:110px;height:110px;margin:0 auto;filter:drop-shadow(0 12px 12px rgba(20,53,34,.22));transition:transform .45s var(--spring)}
.crop:hover .ph{transform:translateY(-6px) rotate(-3deg) scale(1.05)}
.crop b{display:block;font-family:var(--head);font-size:19px;margin-top:8px}
.crop small{color:var(--muted);font-size:12.5px}
.crop .mine{position:absolute;top:10px;right:10px;background:var(--leaf);color:#fff;font-size:10.5px;font-weight:800;padding:4px 8px;border-radius:999px}
.ph.emoji{display:grid;place-items:center;font-size:72px}

/* planted chips */
.chips2{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chips2 button{background:var(--sand);border-radius:999px;padding:10px 14px;font-weight:700;font-size:14px;transition:background .25s,color .25s,transform .25s var(--spring)}
.chips2 button.on{background:var(--forest);color:#fff}

/* dashboard */
.dhero{position:relative;margin-top:14px;border-radius:28px;padding:20px;color:#fff;overflow:hidden;background:linear-gradient(135deg,#1f4d31 0%,#143522 60%,#0f2a1b 100%);box-shadow:0 18px 40px rgba(20,53,34,.25)}
.dhero .ph{position:absolute;right:-14px;bottom:-14px;width:150px;height:150px;filter:drop-shadow(0 14px 18px rgba(0,0,0,.45));animation:float 6s ease-in-out infinite}
.dhero .ph.emoji{font-size:110px}
.dhero h2{font-family:var(--head);font-weight:800;font-size:30px;line-height:1.05;max-width:60%}
.dhero .loc{font-size:13px;opacity:.8;margin-top:4px}
.wx{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;max-width:70%}
.wx span{background:rgba(255,255,255,.14);border-radius:12px;padding:7px 10px;font-size:13px;font-weight:600}
.src{font-size:11px;opacity:.65;margin-top:10px;max-width:62%}
.months{display:flex;gap:7px;overflow-x:auto;padding:16px 2px 4px;scrollbar-width:none;scroll-behavior:smooth}
.months::-webkit-scrollbar{display:none}
.months button{flex:none;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:700;color:var(--muted);transition:all .3s var(--ease)}
.months button.on{background:var(--forest);border-color:var(--forest);color:#fff;transform:scale(1.04)}
.seg{position:relative;display:grid;grid-template-columns:repeat(4,1fr);background:#e9e1c9;border-radius:16px;padding:4px;margin-top:14px}
.seg .ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/4);background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);transition:transform .45s var(--spring)}
.seg button{position:relative;z-index:1;padding:11px 2px;font-size:12.5px;font-weight:800;color:var(--muted);transition:color .3s}
.seg button.on{color:var(--forest)}
.seg button span{display:block;font-size:18px;margin-bottom:1px}
.pane{animation:rise .45s var(--ease) both}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin:16px 2px 10px;flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.pest{background:#fff;border-radius:20px;margin-bottom:12px;box-shadow:0 8px 22px rgba(20,53,34,.07);overflow:hidden;position:relative;animation:rise .5s var(--ease) both}
.pest::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--line)}
.pest.high::before{background:var(--high)}.pest.watch::before{background:var(--watch)}.pest.low::before{background:var(--low)}
.pest .hd{display:flex;align-items:center;gap:12px;padding:15px 14px 15px 18px;width:100%;text-align:left}
.pest .em{width:46px;height:46px;border-radius:14px;background:var(--cream);display:grid;place-items:center;font-size:26px;flex:none}
.pest .nm{flex:1;min-width:0}
.pest .nm b{display:block;font-size:16px}
.pest .nm small{color:var(--muted);font-size:12.5px}
.chev{transition:transform .4s var(--spring);opacity:.5}
.pest.open .chev{transform:rotate(180deg)}
.badge{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:5px 9px;border-radius:999px;flex:none}
.badge.high{background:var(--high-bg);color:var(--high)}.badge.watch{background:var(--watch-bg);color:var(--watch)}.badge.low{background:var(--low-bg);color:var(--low)}
.body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}
.pest.open .body{grid-template-rows:1fr}
.body>div{overflow:hidden}
.body .pad{padding:0 16px 16px 18px}
.why{font-size:13px;background:var(--cream);border-radius:12px;padding:9px 11px;color:var(--muted);margin-bottom:6px}
.ipm{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.ipm .n{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:16px}
.n.s{background:#eef0f7}.n.p{background:#e2f2e5}.n.c{background:#fbf0d4}.n.b{background:#e3eff7}.n.x{background:#fbe5e0}
.ipm b{font-size:14px;display:block;margin-bottom:2px}
.ipm p{font-size:14.5px;color:#33433a}
.prod{display:flex;align-items:center;gap:10px;background:#fff8ef;border:1px solid #f1dcc0;border-radius:14px;padding:10px 12px;margin-top:8px}
.prod .pi{width:34px;height:34px;border-radius:10px;background:#fff;display:grid;place-items:center;font-size:18px;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.prod b{font-size:14px;display:block}
.prod small{color:var(--muted);font-size:12px}
.prod .pr{margin-left:auto;font-weight:800;color:var(--clay);font-size:14px;white-space:nowrap}
.confirm{display:flex;gap:8px;align-items:flex-start;background:#e2f2e5;border-radius:14px;padding:11px 12px;margin-top:12px;font-size:13px;font-weight:700;color:var(--forest2)}
.warn{font-size:12px;color:var(--high);margin-top:4px}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.stage{position:relative;display:flex;gap:14px;padding:0 0 18px 0;animation:rise .5s var(--ease) both}
.stage .rail{flex:none;width:44px;display:flex;flex-direction:column;align-items:center}
.stage .dotc{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:22px;box-shadow:0 6px 16px rgba(20,53,34,.12);z-index:1}
.stage .line{flex:1;width:3px;background:var(--line);margin-top:4px;border-radius:3px}
.stage:last-child .line{display:none}
.stage .card{flex:1;background:#fff;border-radius:20px;padding:14px;box-shadow:0 8px 22px rgba(20,53,34,.07)}
.stage.now .dotc{background:var(--clay);box-shadow:0 0 0 6px rgba(196,104,59,.18)}
.stage.now .card{outline:2px solid var(--clay)}
.when{font-size:11.5px;font-weight:800;color:var(--leaf);text-transform:uppercase;letter-spacing:.5px}
.stage.now .when{color:var(--clay)}
.stage b.tt{display:block;font-size:16px;margin:2px 0}
.stage p{font-size:14.5px;color:#33433a}
.here{display:inline-block;background:var(--clay);color:#fff;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;margin-left:6px;vertical-align:2px}
.ring{display:flex;align-items:center;gap:16px;background:#fff;border-radius:22px;padding:16px;box-shadow:0 8px 22px rgba(20,53,34,.07);margin-top:16px}
.ring svg{flex:none}
.ring b{font-family:var(--head);font-size:22px;display:block}
.task{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:13px 14px;margin-top:10px;box-shadow:0 4px 14px rgba(20,53,34,.05);width:100%;text-align:left;transition:opacity .3s,transform .3s var(--spring)}
.task .ck{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;transition:all .3s var(--spring)}
.task.done .ck{background:var(--leaf);border-color:var(--leaf);color:#fff;transform:scale(1.08)}
.task.done span.tx{text-decoration:line-through;opacity:.55}
.task span.tx{font-size:14.5px;font-weight:600}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.day{background:#fff;border-radius:14px;padding:9px 2px;text-align:center;font-size:12px;box-shadow:0 4px 12px rgba(20,53,34,.06)}
.day .e{font-size:22px;display:block;margin:3px 0}
.day.good{outline:2px solid var(--low)}
.tip{display:flex;gap:12px;background:#fff;border-radius:18px;padding:14px;margin-top:10px;box-shadow:0 4px 14px rgba(20,53,34,.05)}
.tip .em{font-size:26px;flex:none}
.tip p{font-size:14.5px}
h3.h{font-family:var(--head);font-size:21px;margin:22px 0 4px}
.wa{display:flex;align-items:center;gap:14px;border-radius:22px;padding:16px;margin-top:18px;text-decoration:none;color:#fff;background:linear-gradient(135deg,var(--clay) 0%,#a9532c 100%);box-shadow:0 14px 30px rgba(196,104,59,.3)}
.wa.green{background:linear-gradient(135deg,#25a35a 0%,#1a7d43 100%);box-shadow:0 14px 30px rgba(37,163,90,.25)}
.wa .em{font-size:30px}
.wa b{display:block;font-size:15.5px}
.wa small{opacity:.88;font-size:12.5px}
footer{max-width:620px;margin:0 auto;padding:10px 18px 40px;font-size:12px;color:var(--muted);text-align:center}
footer b{color:var(--forest)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);opacity:0;background:var(--forest);color:#fff;padding:12px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:60;transition:all .45s var(--spring);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.show{transform:translate(-50%,0);opacity:1}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast"></div>
<script>
/* ================= STORE ================= */
const STORE = { name:"Foso Hardware", wa:"26663423355", waShow:"+266 63423355", phone:"+266 57543808" };
const P = {

  "Biomectin 18 EC":           {what:"Abamectin 18 g/L — mites, leaf miner, thrips", pack:"1L", price:240},
  "Ag-Metribuzin 480 SC":      {what:"Metribuzin — pre/post-emergence weeds", pack:"1L", price:290},
  "Camix Plus":                {what:"Pre-emergence maize herbicide", pack:"1L", price:340},
  "Guardian":                  {what:"Pre-emergence maize herbicide", pack:"1L", price:310},
  "Calmabon Liquid (Ca + B)":  {what:"Liquid calcium + boron", pack:"20L", price:780},
  "Omnical (Calcium Nitrate)": {what:"Calcium nitrate", pack:"25kg", price:680},
  "Omnia 2:3:4 (30)":          {what:"Balanced NPK + zinc — base dressing", pack:"50kg", price:780},
  "Omnia MAP (39)":            {what:"High-phosphate starter", pack:"50kg", price:950},
  "LAN (28%)":                 {what:"Nitrogen top-dressing", pack:"5kg", price:90},
  "Omnia Omni-K":              {what:"Potassium feed — fruit and tuber fill", pack:"25kg", price:1250},

/* ================= RISK ================= */
function risk(p, d, m, w){
  const c = w || climate(d, m), mean = (c.max + c.min)/2;
  if(!p.m.includes(m+1)) return {lvl:"low", why:t("whyOut")};
  if(mean < p.minT) return {lvl:"low", why:t("whyCold")};
  let boost=false, why=t("whySeason");
  if(p.cond==="wet" && c.rain>=70 && mean<=25){boost=true; why=t("whyWet");}
  if(p.cond==="warmwet" && c.rain>=60 && mean>=17){boost=true; why=t("whyWet");}
  if(p.cond==="hotdry" && c.max>=26 && c.rain<70){boost=true; why=t("whyHot");}
  if(p.cond==="warm" && mean>=21){boost=true; why=t("whyWarm");}
  return {lvl: boost?"high":"watch", why};
}
function topRisk(cid, did){
  const c=crop(cid), d=D[did], m=new Date().getMonth(), order={high:0,watch:1,low:2};
  const list=c.pests.map(id=>({p:PEST[id], r:risk(PEST[id], d, m)})).sort((a,b)=>order[a.r.lvl]-order[b.r.lvl]);
  return list[0];
}

/* ================= LIVE WEATHER ================= */
async function loadWx(){
  const did=S.d, d=D[did]; if(!d) return;
  if(S.wx && S.wx.id===did) return;
  S.wx={id:did, loading:true};
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${d.lat}&longitude=${d.lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max&forecast_days=7&timezone=Africa%2FJohannesburg`;
    const ctl=new AbortController(); setTimeout(()=>ctl.abort(),6000);
    const r=await fetch(u,{signal:ctl.signal}); if(!r.ok) throw 0;
    const j=await r.json(), dd=j.daily;
    S.wx={id:did, days:dd.time.map((x,i)=>({date:x,max:Math.round(dd.temperature_2m_max[i]),min:Math.round(dd.temperature_2m_min[i]),rain:dd.precipitation_sum[i],wind:dd.wind_speed_10m_max[i]}))};
    if(S.view==="dash") render(false);
  }catch(e){ S.wx={id:did, failed:true}; }
}
function wxNow(){
  if(S.wx && S.wx.id===S.d && S.wx.days && S.m===new Date().getMonth()){
    const ds=S.wx.days,n=ds.length;
    return {live:true,max:Math.round(ds.reduce((a,x)=>a+x.max,0)/n),min:Math.round(ds.reduce((a,x)=>a+x.min,0)/n),rain:Math.round(ds.reduce((a,x)=>a+x.rain,0)*4.3)};
  }
  return null;
}

   <div class="tip"><span class="em">🧤</span><p><b>Gloves, mask, long sleeves, boots.</b> Wash hands and clothes after. Keep children away.</p></div>
   <div class="tip"><span class="em">🔁</span><p><b>Rotate products.</b> The same chemical again and again makes pests resistant.</p></div>
   <div class="tip"><span class="em">📅</span><p><b>Days before harvest.</b> Check the label before you pick.</p></div>
   ${prodCard("Aquatech 5 (Wetter)")}${prodCard("Knapsack Sprayer 16L")}<div class="confirm">✅ <span>${t("confirm")}</span></div>`;
  return h;
}
function vDash(){
  const c=crop(S.c), d=D[S.d], live=wxNow(), w=live||climate(d,S.m);
  const tabs=[["pests","🐛"],["fert","🌱"],["season","✅"],["spray","🧴"]], ti=tabs.findIndex(x=>x[0]===S.tab);
  const pane = S.tab==="pests"?paneP(): S.tab==="fert"?paneF(): S.tab==="season"?paneS(): paneSpray();
  const msg=encodeURIComponent(`Hello Foso Hardware 👋 (Roots & Remedy guide) — I have a problem on my ${c.en} in ${d.n}. I am sending a photo.`);
  const al=encodeURIComponent(`Hello Foso Hardware 👋 Please add me to Roots & Remedy weekly tips for ${c.en} in ${d.n}.`);
  return `<div class="screen">${bar(false,true)}<div class="wrap">
    <div class="dhero">${photo(c)}<span class="step" style="margin:0;color:var(--sun)">📍 ${esc(d.n)}</span><h2>${esc(cropName(c))}</h2>
      <div class="wx"><span>☀️ ${w.max}°</span><span>🌙 ${w.min}°</span><span>🌧️ ~${w.rain} mm</span>${w.min<=2?`<span>❄️ ${t("frost")}</span>`:''}</div>
      <div class="src">${live?t("liveNote"):t("climNote")}</div></div>
    <div class="months" id="months">${t("months").map((m,i)=>`<button class="${S.m===i?'on':''}" data-m="${i}">${esc(m)}</button>`).join("")}</div>
    <div class="seg"><div class="ind" style="transform:translateX(${ti*100}%)"></div>${tabs.map(([k,e])=>`<button class="${S.tab===k?'on':''}" data-t="${k}"><span>${e}</span>${t(k)}</button>`).join("")}</div>
    <div class="pane" id="pane">${pane}</div>
    <a class="wa press" href="https://wa.me/${STORE.wa}?text=${msg}" target="_blank" rel="noopener"><span class="em">📷</span><span><b>${t("photoB")}</b><small>${t("photoS")} · ${STORE.waShow}</small></span></a>
    <a class="wa green press" href="https://wa.me/${STORE.wa}?text=${al}" target="_blank" rel="noopener"><span class="em">🔔</span><span><b>${t("alertB")}</b><small>${t("alertS")}</small></span></a>
  </div></div>`;
}

/* ================= RENDER / NAV ================= */
function render(anim=true){
  document.documentElement.lang = S.lang==="st"?"st":"en";
  const html = S.view==="home"?vHome(): S.view==="map"?vMap(): S.view==="crop"?vCrop(): vDash();
  const apply=()=>{
    $("#app").innerHTML = html + (S.view!=="home"?`<footer><p>${t("foot")}</p><p style="margin-top:8px"><b>Roots & Remedy</b> · Open source · Made in Lesotho 🇱🇸</p></footer>`:'');
    if(!anim) $("#app").querySelectorAll(".screen,.pane,.pest,.stage,.crop,.fcard").forEach(e=>e.style.animation="none");
    const mo=$("#months"); if(mo){const on=mo.querySelector(".on"); if(on) mo.scrollLeft=on.offsetLeft-80;}
    bindMap();
  };
  apply();
}
function go(view){
  hideSheet(); S.view=view; S.open=null;
  const run=()=>{ render(); scrollTo({top:0}); };
  if(document.startViewTransition) document.startViewTransition(run); else run();
}
function bindMap(){
  const tops=$("#tops"); if(!tops) return;
  tops.querySelectorAll(".dg").forEach(g=>{
    g.addEventListener("pointerenter",e=>{ if(e.pointerType!=="mouse") return; g.classList.add("hv"); tops.appendChild(g); });
    g.addEventListener("pointerleave",()=>{ g.classList.remove("hv"); const on=tops.querySelector(".dg.on"); if(on) tops.appendChild(on); });
  });
}
function selectDistrict(id){
  const tops=$("#tops"); if(!tops) return;
  tops.querySelectorAll(".dg").forEach(g=>g.classList.toggle("on", g.dataset.d===id));
  const g=tops.querySelector(`[data-d="${id}"]`); if(g) tops.appendChild(g);
  sheetDistrict(id);
}

document.addEventListener("click", e=>{
  const g = e.target.closest(".dg"); if(g){ tick(); selectDistrict(g.dataset.d); return; }
  const a = e.target.closest("[data-act],[data-l],[data-farm],[data-c],[data-m],[data-t],[data-p],[data-task],[data-pl]");
  if(!a){ if(!e.target.closest("#sheet")) hideSheet(); return; }
  tick();
  const ds=a.dataset;
  if(ds.l){ S.lang=ds.l; LS.set("rr_lang",S.lang); render(false); return; }
  if(ds.act==="start"){ go("map"); return; }
  if(ds.act==="back"){ go(S.view==="dash"?(S.farm.length?"home":"crop"):S.view==="crop"?"map":"home"); return; }
  if(ds.act==="pickd"){ S.d=ds.id; S.wx=null; loadWx(); go("crop"); return; }
  if(ds.farm){ const f=S.farm[+ds.farm]; S.d=f.d; S.c=f.c; S.tab="pests"; S.m=new Date().getMonth(); S.wx=null; loadWx(); go("dash"); return; }
  if(ds.c){ S.plantedSel=null; const ex=S.farm.find(f=>f.d===S.d&&f.c===ds.c); if(ex){ S.c=ds.c; S.tab="pests"; go("dash"); } else sheetPlanted(ds.c); return; }
  if(ds.pl){ S.plantedSel=ds.pl; a.parentElement.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b===a)); return; }
  if(ds.act==="savecrop"){
    const v=S.plantedSel; let planted=null;
    if(v!=="n"){ const dt=new Date(); dt.setDate(1); dt.setMonth(dt.getMonth()-(+v||0)); planted=dt.toISOString().slice(0,10); }
    S.farm=S.farm.filter(f=>!(f.d===S.d&&f.c===ds.id)); S.farm.unshift({d:S.d,c:ds.id,planted}); LS.set("rr_farm",S.farm);
    S.c=ds.id; S.tab="pests"; S.m=new Date().getMonth(); toast("✓ "+t("saved")); go("dash"); return;
  }
  if(ds.m){ S.m=+ds.m; render(false); return; }
  if(ds.t){ S.tab=ds.t; S.open=null; render(false);
    const p=$("#pane"); if(p){p.style.animation="none"; p.offsetHeight; p.style.animation="";} return; }
  if(ds.p){ const card=a.closest(".pest"); const was=card.classList.contains("open");
    document.querySelectorAll(".pest.open").forEach(x=>x.classList.remove("open"));
    if(!was){ card.classList.add("open"); S.open=ds.p; setTimeout(()=>card.scrollIntoView({behavior:"smooth",block:"nearest"}),250);} else S.open=null; return; }
  if(ds.task!=null && ds.task!==""){ const key=S.d+":"+S.c, i=+ds.task, arr=S.tasks[key]||[];
    S.tasks[key]= arr.includes(i)? arr.filter(x=>x!==i) : [...arr,i]; LS.set("rr_tasks",S.tasks); render(false); return; }
  if(ds.act==="resettasks"){ delete S.tasks[S.d+":"+S.c]; LS.set("rr_tasks",S.tasks); render(false); return; }
});
render();
</script>
</body>
</html>
