<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roots & Remedy Agri Guide</title>
<style>
:root{
  --forest:#1d4a2c; --forest2:#2a6a3e; --leaf:#3f9b52; --soil:#6b4a2b; --sun:#e8b33a;
  --cream:#f7f4ea; --card:#ffffff; --ink:#1b2a20; --muted:#5f6d63; --line:#e3ddc9;
  --high:#c4412e; --high-bg:#fbe6e2; --watch:#c98a12; --watch-bg:#fdf1d6; --low:#2f8a46; --low-bg:#e3f3e6;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--cream);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}
header{background:var(--forest);color:#fff;padding:14px 16px 16px;position:sticky;top:0;z-index:5;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.hrow{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--leaf);display:grid;place-items:center;flex:none}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:17px;letter-spacing:.2px}
.brand span{font-size:12px;opacity:.8}
.lang{display:flex;background:rgba(255,255,255,.14);border-radius:999px;padding:3px}
.lang button{padding:6px 10px;border-radius:999px;font-size:13px;font-weight:600;color:#fff;opacity:.75}
.lang button.on{background:#fff;color:var(--forest);opacity:1}
.chips{max-width:560px;margin:10px auto 0;display:flex;gap:8px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center}
.chip small{opacity:.75;font-weight:500}
h1{font-size:22px;margin:22px 0 4px}
h2{font-size:18px;margin:22px 0 10px}
.sub{color:var(--muted);font-size:14px;margin-bottom:14px}
.step{display:inline-block;background:var(--forest);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;margin-top:20px}
/* district map */
.map{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#e9e2cc;border-radius:var(--r);padding:10px;position:relative}
.map .d{background:var(--card);border-radius:12px;min-height:78px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;border:2px solid transparent;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.map .d b{font-size:14px}
.map .d small{font-size:11px;color:var(--muted)}
.map .d.hl{background:#eef5ee}
.map .d.on{border-color:var(--leaf);background:#e3f3e6}
.map .m{border-radius:12px;background:repeating-linear-gradient(135deg,#ddd3b6 0 6px,#e5dcc2 6px 12px);min-height:78px}
.compass{font-size:11px;color:var(--muted);text-align:right;margin-top:6px}
/* crops */
.crops{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.crop{background:var(--card);border-radius:var(--r);padding:16px 10px;text-align:center;border:2px solid transparent;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.crop .ic{font-size:52px;line-height:1.1}
.crop b{display:block;font-size:16px;margin-top:6px}
.crop small{color:var(--muted);font-size:12px}
.crop.on{border-color:var(--leaf)}
/* dashboard */
.wx{background:linear-gradient(135deg,var(--forest2),var(--forest));color:#fff;border-radius:var(--r);padding:16px;margin-top:16px}
.wx .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.wx h3{font-size:15px;font-weight:600;opacity:.9}
.wx .big{font-size:30px;font-weight:800;margin-top:2px}
.wx .row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.wx .pill{background:rgba(255,255,255,.15);border-radius:10px;padding:6px 10px;font-size:13px}
.wx .src{font-size:11px;opacity:.7;margin-top:10px}
.months{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.months::-webkit-scrollbar{display:none}
.months button{flex:none;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.months button.on{background:var(--forest);border-color:var(--forest);color:#fff}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:#e9e2cc;border-radius:12px;padding:4px;margin-top:14px;gap:4px}
.tabs button{padding:10px 4px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--forest);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin:14px 0 8px;flex-wrap:wrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.pest{background:var(--card);border-radius:var(--r);margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.07);overflow:hidden;border-left:6px solid var(--line)}
.pest.high{border-left-color:var(--high)} .pest.watch{border-left-color:var(--watch)} .pest.low{border-left-color:var(--low)}
.pest .hd{display:flex;align-items:center;gap:12px;padding:14px;width:100%;text-align:left}
.pest .em{font-size:34px;flex:none;width:44px;text-align:center}
.pest .nm{flex:1;min-width:0}
.pest .nm b{display:block;font-size:16px}
.pest .nm small{color:var(--muted);font-size:12px}
.badge{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:5px 9px;border-radius:999px;flex:none}
.badge.high{background:var(--high-bg);color:var(--high)} .badge.watch{background:var(--watch-bg);color:var(--watch)} .badge.low{background:var(--low-bg);color:var(--low)}
.body{padding:0 14px 14px;display:none}
.pest.open .body{display:block}
.why{font-size:13px;background:var(--cream);border-radius:10px;padding:8px 10px;color:var(--muted);margin-bottom:10px}
.ipm{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ipm .n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px}
.ipm .n.s{background:#eef0f7} .ipm .n.p{background:#e3f3e6} .ipm .n.c{background:#fdf1d6} .ipm .n.b{background:#e6f1f7} .ipm .n.x{background:#fbe6e2}
.ipm b{font-size:14px;display:block}
.ipm p{font-size:14px;color:#33433a}
.prod{background:#fff8f0;border:1px solid #f0dcc0;border-radius:12px;padding:10px 12px;margin-top:8px}
.prod b{font-size:14px}
.prod small{display:block;color:var(--muted);font-size:12px}
.prod .pr{float:right;font-weight:800;color:var(--soil);font-size:14px}
.confirm{display:flex;gap:8px;align-items:flex-start;background:#eef5ee;border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13px;font-weight:600;color:var(--forest)}
.warn{font-size:12px;color:var(--high);margin-top:6px}
.stage{display:flex;gap:12px;background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.stage .em{font-size:30px;flex:none;width:40px;text-align:center}
.stage b{display:block;font-size:15px}
.stage .when{font-size:12px;font-weight:700;color:var(--leaf);text-transform:uppercase;letter-spacing:.3px}
.stage p{font-size:14px;color:#33433a;margin-top:2px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.day{background:var(--card);border-radius:12px;padding:8px 2px;text-align:center;font-size:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.day .e{font-size:22px;display:block;margin:2px 0}
.day.good{outline:2px solid var(--low)}
.tip{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.07);display:flex;gap:12px}
.tip .em{font-size:28px;flex:none}
.tip p{font-size:14px}
.cta{display:flex;align-items:center;gap:12px;background:var(--soil);color:#fff;border-radius:var(--r);padding:14px 16px;margin-top:18px;text-decoration:none}
.cta .em{font-size:30px}
.cta b{display:block;font-size:15px}
.cta small{opacity:.85;font-size:12px}
.btn{display:block;width:100%;background:var(--forest);color:#fff;border-radius:14px;padding:14px;font-weight:700;font-size:16px;margin-top:16px;text-align:center}
.ghost{background:transparent;color:var(--forest);border:2px solid var(--forest)}
footer{max-width:560px;margin:0 auto;padding:18px 16px 40px;font-size:12px;color:var(--muted);text-align:center}
footer b{color:var(--forest)}
</style>
</head>

/* ================= RISK ================= */
function risk(p, d, m, w){
  const c = w || climate(d, m);
  const mean = (c.max + c.min) / 2;
  const inSeason = p.m.includes(m+1);
  if(!inSeason) return {lvl:"low", why:t("whyOut")};
  if(mean < p.minT) return {lvl:"low", why:t("whyCold")};
  let boost = false, why = t("whySeason");
  if(p.cond==="wet" && c.rain>=70 && mean<=25){boost=true; why=t("whyWet");}
  if(p.cond==="warmwet" && c.rain>=60 && mean>=17){boost=true; why=t("whyWet");}
  if(p.cond==="hotdry" && c.max>=26 && c.rain<70){boost=true; why=t("whyHot");}
  if(p.cond==="warm" && mean>=21){boost=true; why=t("whyWarm");}
  return {lvl: boost ? "high" : "watch", why};
}

/* ================= LIVE WEATHER (works when hosted on its own site) ================= */
async function loadWx(){
  const d = dist(); if(!d) return;
  S.wx = null;
  try{
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${d.lat}&longitude=${d.lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max,weather_code&forecast_days=7&timezone=Africa%2FJohannesburg`;
    const ctl = new AbortController(); setTimeout(()=>ctl.abort(), 6000);
    const r = await fetch(u, {signal:ctl.signal}); if(!r.ok) throw 0;
    const j = await r.json(); const dd = j.daily;
    S.wx = {id:d.id, days: dd.time.map((x,i)=>({date:x, max:Math.round(dd.temperature_2m_max[i]), min:Math.round(dd.temperature_2m_min[i]), rain:dd.precipitation_sum[i], wind:dd.wind_speed_10m_max[i], code:dd.weather_code[i]}))};
    render();
  }catch(e){ S.wx = {id:d.id, failed:true}; }
}
function wxNow(){
  const d = dist();
  if(S.wx && S.wx.id===d.id && S.wx.days && S.m===new Date().getMonth()){
    const ds = S.wx.days, n = ds.length;
    return {live:true, max:Math.round(ds.reduce((a,x)=>a+x.max,0)/n), min:Math.round(ds.reduce((a,x)=>a+x.min,0)/n),
            rain:Math.round(ds.reduce((a,x)=>a+x.rain,0)*4.3)}; /* weekly rain scaled to a month for risk rules */
  }
  return null;
}

  chips();
  const app = $("#app");
  if(!S.d) app.innerHTML = viewDistrict();
  else if(!S.c) app.innerHTML = viewCrop();
  else app.innerHTML = viewDash();
  const mo = $("#months"); if(mo){ const on = mo.querySelector(".on"); if(on) mo.scrollLeft = on.offsetLeft - 60; }
}

/* ================= EVENTS ================= */
document.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.l){ S.lang=b.dataset.l; save(); render(); return; }
  if(b.dataset.go==="d"){ S.d=null; render(); scrollTo(0,0); return; }
  if(b.dataset.go==="c"){ S.c=null; render(); scrollTo(0,0); return; }
  if(b.dataset.d){ S.d=b.dataset.d; save(); S.wx=null; loadWx(); render(); scrollTo(0,0); return; }
  if(b.dataset.c){ S.c=b.dataset.c; S.open=null; save(); render(); scrollTo(0,0); return; }
  if(b.dataset.m){ S.m=+b.dataset.m; render(); return; }
  if(b.dataset.t){ S.tab=b.dataset.t; render(); return; }
  if(b.dataset.p){ S.open = S.open===b.dataset.p ? null : b.dataset.p; render(); return; }
});
if(S.d) loadWx();
render();
</script>
</body>
</html>
